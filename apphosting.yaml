# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Leaguepedia bot credentials (usate solo lato server in app/api/leaguepedia).
  - variable: LEAGUEPEDIA_USERNAME
    value: "PureSnake065@fanta-fam"
    availability:
      - RUNTIME
  - variable: LEAGUEPEDIA_BOT_PASSWORD
    secret: LEAGUEPEDIA_BOT_PASSWORD
    availability:
      - RUNTIME

  # Chiave API non ufficiale di lolesports.com (esports-api.lolesports.com /
  # feed.lolesports.com), usata solo lato server. Non è una credenziale
  # personale: è il valore pubblico che lolesports.com stesso spedisce a
  # ogni browser che lo visita, documentato in chiaro nello swagger della
  # community (vickz84259/lolesports-api-docs) — per questo qui in chiaro
  # e non su Secret Manager, stesso trattamento di LEAGUEPEDIA_USERNAME.
  - variable: LOLESPORTS_API_KEY
    value: "0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z"
    availability:
      - RUNTIME

  # Config Firebase client-side (pubblica, inlineata nel bundle al build).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyA1PBLdsSE8e_hSWhUkFPsgrO4liwzBKgQ"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "fam-fanta-app.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "fam-fanta-app"
