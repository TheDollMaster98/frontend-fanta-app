name: Deploy App Hosting

# Deploy pilotato SOLO da questa Action, non dal collegamento automatico
# di Firebase Console: se il backend "fam-fanta-app-be" risulta collegato
# a questo repo in Firebase Console > App Hosting, vai lì e scollegalo (o
# assicurati che non abbia un branch live configurato), altrimenti ogni
# push su main farebbe due deploy in parallelo — uno da qui, uno da
# Firebase stesso. Quel controllo è manuale, va fatto una volta in
# Console, non è automatizzabile da qui.
#
# Parte da sola ad ogni push su main, più "Run workflow" manuale dalla
# tab Actions per un rollout forzato. Richiede lo stesso secret
# FIREBASE_SERVICE_ACCOUNT del workflow delle regole Firestore (vedi
# deploy-firestore.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configura credenziali Google Cloud
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "${RUNNER_TEMP}/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/firebase-service-account.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy backend App Hosting
        run: >
          npx firebase-tools@latest deploy
          --only apphosting:fam-fanta-app-be
          --project fam-fanta-app
          --non-interactive
