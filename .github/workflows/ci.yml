name: CI

# Gira su ogni push e ogni PR: lint + build, niente segreti richiesti.
# Serve a beccare un branch rotto prima che arrivi a master (branch di
# deploy), non fa deploy. Il job "build" qui sotto è il check da usare
# come required status check nella branch protection rule, se ne
# configuri una (Settings > Branches).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Valori fittizi: al build servono solo per non far esplodere
          # l'inizializzazione del client Firebase. I valori veri li usa
          # solo il backend a runtime (li mette Firebase App Hosting da
          # apphosting.yaml), questa CI non li tocca né ne ha bisogno.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
